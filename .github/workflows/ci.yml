# Quality gates for PRs and pushes to long-lived branches (E6+).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-contract:
    name: sim-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            simulation/requirements.txt

      - name: Bootstrap venv + deps
        run: make bootstrap

      - name: Simulation GT / answer-key contract
        run: make test-sim-contract

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            simulation/requirements.txt

      - name: Bootstrap venv + deps
        run: make bootstrap

      - name: Unit tests
        run: make test
