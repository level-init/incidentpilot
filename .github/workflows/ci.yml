# Quality gates for PRs and pushes to long-lived branches (E6+).
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim-contract:
    name: sim-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            simulation/requirements.txt

      - name: Bootstrap venv + deps
        run: make bootstrap

      - name: Simulation GT / answer-key contract
        run: make test-sim-contract

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            simulation/requirements.txt

      - name: Bootstrap venv + deps
        run: make bootstrap

      - name: Unit tests
        run: make test

  # D6: Temporal five-test regression (Postgres + WorkflowEnvironment harness).
  temporal-d6:
    name: temporal-d6
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incidentpilot
          POSTGRES_PASSWORD: incidentpilot
          POSTGRES_DB: incidentpilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incidentpilot -d incidentpilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ip_app:incidentpilot_app@localhost:5432/incidentpilot
      MIGRATE_DSN: postgresql://incidentpilot:incidentpilot@localhost:5432/incidentpilot
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: incidentpilot
      IP_APP_PASSWORD: incidentpilot_app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            simulation/requirements.txt

      - name: Bootstrap venv + deps
        run: make bootstrap

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply migrations
        run: make migrate

      - name: D6 Temporal five-test suite
        run: make test-temporal-d6
