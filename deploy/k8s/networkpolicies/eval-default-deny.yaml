# O4: default-deny on the eval plane. Control-plane pods have no allow path here.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: incidentpilot-eval
  labels:
    app.kubernetes.io/part-of: incidentpilot
    incidentpilot.io/plane: eval
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: incidentpilot-eval
  labels:
    app.kubernetes.io/part-of: incidentpilot
    incidentpilot.io/plane: eval
spec:
  podSelector: {}
  policyTypes:
    - Egress
