# O3: one privilege class → one ServiceAccount. No shared admin SA.
# IRSA: annotate with eks.amazonaws.com/role-arn from Terraform outputs (staging).
# Local kind/k3d: apply without IRSA annotations.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incidentpilot-api
  namespace: incidentpilot-system
  labels:
    app.kubernetes.io/name: incidentpilot-api
    app.kubernetes.io/part-of: incidentpilot
    incidentpilot.io/privilege-class: api
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incidentpilot-worker
  namespace: incidentpilot-system
  labels:
