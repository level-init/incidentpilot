# Remediation privilege-class identity (J11; O3 extends IRSA annotations).
# One privilege class → one SA. Never share with api / worker / evaluator.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: incidentpilot-remediation
  namespace: incidentpilot-system
  labels:
    app.kubernetes.io/name: incidentpilot-remediation
    app.kubernetes.io/part-of: incidentpilot
    incidentpilot.io/privilege-class: remediation
automountServiceAccountToken: true
