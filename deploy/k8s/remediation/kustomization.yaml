apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../identity
  - ../namespaces/approved-targets.yaml
  - rolebindings.yaml
# role.yaml is the canonical rules template; rolebindings.yaml materializes it.
# ServiceAccount for remediation is owned by ../identity (O3) — no shared admin SA.
