# Canonical remediation Role rules (J11).
# Identical Role objects are materialized per approved namespace in
# rolebindings.yaml. Edit rules here first, then mirror into that file.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: incidentpilot-remediation-mutate
  namespace: sim-checkout
  labels:
    app.kubernetes.io/part-of: incidentpilot
    incidentpilot.io/privilege-class: remediation
rules:
  # ROLLBACK_DEPLOYMENT — read + patch Deployment / ReplicaSet revision
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # SCALE_WORKLOAD — deployments/scale (+ statefulsets for stateful sims)
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets", "statefulsets/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # RESTART_WORKLOAD — rollout restart (annotation patch) or delete Pod
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
