# Default values — override with values-<env>.yaml (O2).
# Secrets are references only; never put raw tokens here.

global:
  environment: local
  imageRegistry: ghcr.io/level-init
  imagePullPolicy: IfNotPresent
  labels:
    app.kubernetes.io/part-of: incidentpilot

namespace:
  create: false
  name: incidentpilot-system

evalNamespace:
  create: false
  name: incidentpilot-eval

# One privilege class → one SA (O3). No shared admin SA.
serviceAccounts:
  create: true
  api: incidentpilot-api
  worker: incidentpilot-worker
  evidence: incidentpilot-evidence
  remediation: incidentpilot-remediation
  evaluator: incidentpilot-evaluator
  runner: incidentpilot-runner
  web: incidentpilot-web

# Annotate SAs with Terraform module.irsa outputs when deploying to EKS.
irsa:
  enabled: false
  roleArns:
    api: ""
    worker: ""
    evidence: ""
    remediation: ""
    evaluator: ""
    runner: ""
    web: ""

api:
  enabled: true
  replicaCount: 1
  image:
    repository: incidentpilot-api
    tag: "dev"
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    AUTH_MODE: stub
    CORS_ORIGINS: "http://localhost:3000"

worker:
  enabled: true
  replicaCount: 1
  image:
    repository: incidentpilot-worker
    tag: "dev"
  args: ["general"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

evidenceWorker:
  enabled: true
  replicaCount: 1
  image:
    repository: incidentpilot-worker
    tag: "dev"
  args: ["evidence"]
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

remediation:
  enabled: true
  replicaCount: 1
  image:
    repository: incidentpilot-remediation
    tag: "dev"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

web:
  enabled: true
  replicaCount: 1
  image:
    repository: incidentpilot-web
    tag: "dev"
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  env:
    NEXT_PUBLIC_API_BASE_URL: "http://incidentpilot-api:8000"

evaluator:
  enabled: false
  replicaCount: 1
  image:
    repository: incidentpilot-evaluator
    tag: "dev"
  args: ["pin"]
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

scenarioRunner:
  enabled: false
  replicaCount: 1
  image:
    repository: incidentpilot-scenario-runner
    tag: "dev"
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

config:
  databaseSecretName: incidentpilot-db
  # Deprecated alias — prefer config.temporal.address (kept for schema/back-compat).
  temporalHost: temporal-frontend:7233
  # O6: Temporal Cloud preferred for staging/production-demo; selfhosted = Compose/in-cluster.
  temporal:
    hosting: selfhosted
    address: temporal-frontend:7233
    namespace: default
    tls: false
    apiKeySecretName: ""
    apiKeySecretKey: api_key
  s3Endpoint: ""
  logLevel: info

# O5: separate Ingress for humans (OIDC/session) vs providers (webhook secrets).
# Disabled by default; enable per env. Never put OIDC auth on webhooks.*.
ingress:
  enabled: false
  className: nginx
  annotations: {}
  user:
    enabled: true
    # OIDC / oauth2-proxy belongs on the user Ingress only.
    annotations:
      nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth"
      nginx.ingress.kubernetes.io/auth-signin: "https://app.incidentpilot.example/oauth2/start?rd=$scheme://$host$escaped_request_uri"
    tls: []
    hosts:
      - host: app.incidentpilot.example
        paths:
          - path: /
            pathType: Prefix
            service: incidentpilot-web
            port: 3000
      - host: api.incidentpilot.example
        paths:
          - path: /
            pathType: Prefix
            service: incidentpilot-api
            port: 8000
  webhooks:
    enabled: true
    # Intentionally empty of OIDC/oauth2 annotations — AM/Slack/GitHub secrets only.
    annotations: {}
    tls: []
    hosts:
      - host: hooks.incidentpilot.example
        paths:
          - path: /webhooks
            pathType: Prefix
            service: incidentpilot-api
            port: 8000
