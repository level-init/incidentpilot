{{- /*
  O5: provider webhook Ingress (Alertmanager / Slack / GitHub).
  No OIDC / oauth2-proxy annotations — app verifies webhook secrets (F1/K2).
*/ -}}
{{- if and .Values.ingress.enabled .Values.ingress.webhooks.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "incidentpilot.fullname" . }}-webhooks
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "incidentpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingress-webhooks
    incidentpilot.io/ingress-class: webhooks
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.ingress.webhooks.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- $tls := .Values.ingress.webhooks.tls | default list }}
  {{- if $tls }}
  tls:
    {{- range $tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
  {{- end }}
  rules:
    {{- range .Values.ingress.webhooks.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path | quote }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ .service }}
                port:
                  number: {{ .port }}
          {{- end }}
    {{- end }}
{{- end }}
