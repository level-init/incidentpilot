{{- if .Values.evaluator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incidentpilot.fullname" . }}-evaluator
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "incidentpilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: evaluator
spec:
  replicas: {{ .Values.evaluator.replicaCount }}
  selector:
    matchLabels:
      {{- include "incidentpilot.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "evaluator") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "incidentpilot.selectorLabels" (dict "Chart" .Chart "Release" .Release "Values" .Values "component" "evaluator") | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccounts.evaluator }}
      containers:
        - name: evaluator
          image: {{ include "incidentpilot.image" (dict "root" . "image" .Values.evaluator.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            {{- toYaml .Values.evaluator.args | nindent 12 }}
          env:
            {{- include "incidentpilot.componentEnv" (dict "root" . "extra" dict) | nindent 12 }}
          resources:
            {{- toYaml .Values.evaluator.resources | nindent 12 }}
{{- end }}
