{{- if .Values.serviceAccounts.create }}
{{- $root := . }}
{{- $classes := list
  (dict "key" "api" "name" .Values.serviceAccounts.api "ns" .Values.namespace.name)
  (dict "key" "worker" "name" .Values.serviceAccounts.worker "ns" .Values.namespace.name)
  (dict "key" "evidence" "name" .Values.serviceAccounts.evidence "ns" .Values.namespace.name)
  (dict "key" "remediation" "name" .Values.serviceAccounts.remediation "ns" .Values.namespace.name)
  (dict "key" "web" "name" .Values.serviceAccounts.web "ns" .Values.namespace.name)
  (dict "key" "evaluator" "name" .Values.serviceAccounts.evaluator "ns" .Values.evalNamespace.name)
  (dict "key" "runner" "name" .Values.serviceAccounts.runner "ns" .Values.evalNamespace.name)
}}
{{- range $c := $classes }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $c.name }}
  namespace: {{ $c.ns }}
  labels:
    {{- include "incidentpilot.labels" $root | nindent 4 }}
    app.kubernetes.io/name: {{ $c.name }}
    incidentpilot.io/privilege-class: {{ $c.key }}
  {{- if and $root.Values.irsa.enabled (index $root.Values.irsa.roleArns $c.key) }}
  annotations:
    eks.amazonaws.com/role-arn: {{ index $root.Values.irsa.roleArns $c.key | quote }}
  {{- end }}
automountServiceAccountToken: true
{{- end }}
{{- end }}
