# Staging shape on EKS (O2). Ingress split (O5): user OIDC vs webhook secrets.
global:
  environment: staging
  imageRegistry: ghcr.io/level-init
  imagePullPolicy: IfNotPresent

namespace:
  create: false
  name: incidentpilot-system

evalNamespace:
  create: false
  name: incidentpilot-eval

serviceAccounts:
  create: true

irsa:
  enabled: true
  # Fill from: terraform output -raw irsa_privilege_class_role_arns (JSON map)
  roleArns:
    api: ""
    worker: ""
    evidence: ""
    remediation: ""
    evaluator: ""
    runner: ""
    web: ""

api:
  replicaCount: 2
  image:
    tag: "staging"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  env:
    AUTH_MODE: oidc
    CORS_ORIGINS: "https://staging.incidentpilot.example"

worker:
  replicaCount: 2
  image:
    tag: "staging"

evidenceWorker:
  replicaCount: 2
  image:
    tag: "staging"

remediation:
  replicaCount: 2
  image:
    tag: "staging"

web:
  replicaCount: 2
  image:
    tag: "staging"
  env:
    NEXT_PUBLIC_API_BASE_URL: "https://api.staging.incidentpilot.example"

evaluator:
  enabled: true
  replicaCount: 1
  image:
    tag: "staging"

scenarioRunner:
  enabled: false

config:
  databaseSecretName: incidentpilot-db
  temporalHost: temporal-frontend.temporal:7233
  s3Endpoint: ""
  logLevel: info

ingress:
  enabled: true
  className: nginx
  user:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.auth.svc.cluster.local/oauth2/auth"
      nginx.ingress.kubernetes.io/auth-signin: "https://staging.incidentpilot.example/oauth2/start?rd=$scheme://$host$escaped_request_uri"
    hosts:
      - host: staging.incidentpilot.example
        paths:
          - path: /
            pathType: Prefix
            service: incidentpilot-web
            port: 3000
      - host: api.staging.incidentpilot.example
        paths:
          - path: /
            pathType: Prefix
            service: incidentpilot-api
            port: 8000
  webhooks:
    enabled: true
    annotations: {}
    hosts:
      - host: hooks.staging.incidentpilot.example
        paths:
          - path: /webhooks
            pathType: Prefix
            service: incidentpilot-api
            port: 8000
