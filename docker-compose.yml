# IncidentPilot local Compose profiles (A4 / A6).
#
# Profiles:
#   core        — postgres, temporal (+ UI), local S3 (Silo/MinIO-API) + bucket init
#   redis       — optional cache-only Redis (not required for core)
#   evidence    — placeholder for Prom/Loki/Tempo/AM (Epic E/G)
#   simulation  — demo microservices gateway/auth/checkout/payment/inventory/notification (E1)
#   full        — core + redis + evidence + simulation
#
# Examples:
#   docker compose --profile core up -d
#   docker compose --profile core --profile redis up -d
#   docker compose --profile full up -d
#   make compose-core

name: incidentpilot

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incidentpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentpilot}
      POSTGRES_DB: ${POSTGRES_DB:-incidentpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/compose/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-incidentpilot} -d ${POSTGRES_DB:-incidentpilot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.26.2
    profiles: ["core", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-incidentpilot}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-incidentpilot}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # Listen on all interfaces so localhost healthchecks and UI connect reliably.
      BIND_ON_IP: "0.0.0.0"
    ports:
      - "7233:7233"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7233'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: ["core", "full"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8088:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Local S3-compatible blob store. MinIO CE images left Docker Hub; Silo is a
  # MinIO-API compatible drop-in (same MINIO_* env vars and /minio/health/live).
  minio:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    profiles: ["core", "full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Create local buckets once Silo is healthy (idempotent).
  minio-init:
    image: amazon/aws-cli:2.22.35
    profiles: ["core", "full"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      EVIDENCE_BUCKET: ${S3_BUCKET_EVIDENCE:-incidentpilot-evidence}
      AI_ARTIFACTS_BUCKET: ${S3_BUCKET_AI_ARTIFACTS:-incidentpilot-ai-artifacts}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for b in "$${EVIDENCE_BUCKET}" "$${AI_ARTIFACTS_BUCKET}"; do
          aws --endpoint-url "$${S3_ENDPOINT}" s3 mb "s3://$${b}" 2>/dev/null || true
          aws --endpoint-url "$${S3_ENDPOINT}" s3api head-bucket --bucket "$${b}" >/dev/null
          echo "bucket ready: $${b}"
        done
    restart: "no"

  # Optional local cache only — never authoritative for domain state.
  # Enable with: docker compose --profile core --profile redis up -d
  redis:
    image: redis:7-alpine
    profiles: ["redis", "full"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Placeholders / Epic E simulation world ---

  evidence-stack-placeholder:
    image: alpine:3.20
    profiles: ["evidence", "full"]
    command:
      [
        "sh",
        "-c",
        "echo 'evidence profile: Prometheus/Loki/Tempo/Alertmanager land in Epic E/G'; sleep infinity",
      ]

  # Simulation microservices (E1). Happy path: POST http://localhost:8100/v1/checkout
  sim-auth:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: auth }
    profiles: ["simulation", "full"]
    ports: ["8101:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-auth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim-checkout:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: checkout }
    profiles: ["simulation", "full"]
    ports: ["8102:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-checkout
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim-payment:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: payment }
    profiles: ["simulation", "full"]
    ports: ["8103:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-payment
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim-inventory:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: inventory }
    profiles: ["simulation", "full"]
    ports: ["8104:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-inventory
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim-notification:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: notification }
    profiles: ["simulation", "full"]
    ports: ["8105:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-notification
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim-gateway:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: gateway }
    profiles: ["simulation", "full"]
    ports: ["8100:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-gateway
      SIM_AUTH_URL: http://sim-auth:8080
      SIM_CHECKOUT_URL: http://sim-checkout:8080
      SIM_PAYMENT_URL: http://sim-payment:8080
      SIM_INVENTORY_URL: http://sim-inventory:8080
      SIM_NOTIFICATION_URL: http://sim-notification:8080
    depends_on:
      sim-auth:
        condition: service_healthy
      sim-checkout:
        condition: service_healthy
      sim-payment:
        condition: service_healthy
      sim-inventory:
        condition: service_healthy
      sim-notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  minio_data:
