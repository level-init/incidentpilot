# IncidentPilot local Compose profiles (A4 / A6 / E3).
#
# Profiles:
#   core        — postgres, temporal (+ UI), local S3 (Silo/MinIO-API) + bucket init
#   redis       — optional cache-only Redis (not required for core)
#   evidence    — Prometheus, Loki, Tempo, Grafana, Alertmanager, Promtail (E3)
#   simulation  — demo microservices gateway/auth/checkout/payment/inventory/notification
#   full        — core + redis + evidence + simulation
#
# Examples:
#   docker compose --profile core up -d
#   docker compose --profile core --profile redis up -d
#   docker compose --profile evidence --profile simulation up -d
#   docker compose --profile full up -d
#   make compose-core

name: incidentpilot

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core", "full"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incidentpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentpilot}
      POSTGRES_DB: ${POSTGRES_DB:-incidentpilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/compose/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-incidentpilot} -d ${POSTGRES_DB:-incidentpilot}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  temporal:
    image: temporalio/auto-setup:1.26.2
    profiles: ["core", "full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-incidentpilot}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-incidentpilot}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      # Listen on all interfaces so localhost healthchecks and UI connect reliably.
      BIND_ON_IP: "0.0.0.0"
    ports:
      - "7233:7233"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/7233'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  temporal-ui:
    image: temporalio/ui:2.31.2
    profiles: ["core", "full"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8088:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # Local S3-compatible blob store. MinIO CE images left Docker Hub; Silo is a
  # MinIO-API compatible drop-in (same MINIO_* env vars and /minio/health/live).
  minio:
    image: pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    profiles: ["core", "full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Create local buckets once Silo is healthy (idempotent).
  minio-init:
    image: amazon/aws-cli:2.22.35
    profiles: ["core", "full"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      S3_ENDPOINT: http://minio:9000
      EVIDENCE_BUCKET: ${S3_BUCKET_EVIDENCE:-incidentpilot-evidence}
      AI_ARTIFACTS_BUCKET: ${S3_BUCKET_AI_ARTIFACTS:-incidentpilot-ai-artifacts}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        for b in "$${EVIDENCE_BUCKET}" "$${AI_ARTIFACTS_BUCKET}"; do
          aws --endpoint-url "$${S3_ENDPOINT}" s3 mb "s3://$${b}" 2>/dev/null || true
          aws --endpoint-url "$${S3_ENDPOINT}" s3api head-bucket --bucket "$${b}" >/dev/null
          echo "bucket ready: $${b}"
        done
    restart: "no"

  # Optional local cache only — never authoritative for domain state.
  # Enable with: docker compose --profile core --profile redis up -d
  redis:
    image: redis:7-alpine
    profiles: ["redis", "full"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Observability stack (E3) — profile: evidence ---

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["evidence", "full"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports: ["9090:9090"]
    volumes:
      - ./deploy/compose/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/compose/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: ["evidence", "full"]
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports: ["9093:9093"]
    volumes:
      - ./deploy/compose/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  loki:
    image: grafana/loki:3.2.1
    profiles: ["evidence", "full"]
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports: ["3100:3100"]
    volumes:
      - ./deploy/compose/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  tempo:
    image: grafana/tempo:2.6.1
    profiles: ["evidence", "full"]
    command: ["-config.file=/etc/tempo/tempo-config.yml"]
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./deploy/compose/observability/tempo/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  promtail:
    image: grafana/promtail:3.2.1
    profiles: ["evidence", "full"]
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./deploy/compose/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["evidence", "full"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports: ["3000:3000"]
    volumes:
      - ./deploy/compose/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/compose/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Simulation microservices (E1/E2). Happy path: POST http://localhost:8100/v1/checkout
  # OTEL_* points at Tempo when the evidence profile is also running.
  sim-auth:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: auth }
    profiles: ["simulation", "full"]
    ports: ["8101:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-auth
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim-checkout:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: checkout }
    profiles: ["simulation", "full"]
    ports: ["8102:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-checkout
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim-payment:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: payment }
    profiles: ["simulation", "full"]
    ports: ["8103:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-payment
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim-inventory:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: inventory }
    profiles: ["simulation", "full"]
    ports: ["8104:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-inventory
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim-notification:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: notification }
    profiles: ["simulation", "full"]
    ports: ["8105:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-notification
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  sim-gateway:
    build:
      context: ./simulation
      dockerfile: Dockerfile
      args: { SERVICE: gateway }
    profiles: ["simulation", "full"]
    ports: ["8100:8080"]
    environment:
      OTEL_SERVICE_NAME: sim-gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      SIM_AUTH_URL: http://sim-auth:8080
      SIM_CHECKOUT_URL: http://sim-checkout:8080
      SIM_PAYMENT_URL: http://sim-payment:8080
      SIM_INVENTORY_URL: http://sim-inventory:8080
      SIM_NOTIFICATION_URL: http://sim-notification:8080
    depends_on:
      sim-auth:
        condition: service_healthy
      sim-checkout:
        condition: service_healthy
      sim-payment:
        condition: service_healthy
      sim-inventory:
        condition: service_healthy
      sim-notification:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Baseline traffic generator (E4). duration=0 runs until stopped.
  sim-traffic:
    build:
      context: ./simulation
      dockerfile: Dockerfile.traffic
    profiles: ["simulation", "full"]
    environment:
      SIM_GATEWAY_URL: http://sim-gateway:8080
      SIM_AUTH_URL: http://sim-auth:8080
      SIM_CHECKOUT_URL: http://sim-checkout:8080
      SIM_PAYMENT_URL: http://sim-payment:8080
      SIM_INVENTORY_URL: http://sim-inventory:8080
      SIM_NOTIFICATION_URL: http://sim-notification:8080
    depends_on:
      sim-gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  grafana_data:
